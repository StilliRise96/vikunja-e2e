[pytest]
base_url = http://localhost:3456
testpaths = tests
filterwarnings =
    # pytest-bdd 8.1.0 uses pytest internals deprecated for pytest 10.
    # Harmless on pinned pytest 9.1.1. Remove this filter when upgrading either package.
    ignore:Passing nodeid to _register_fixture is deprecated:pytest.PytestRemovedIn10Warning
    ignore:Passing baseid to FixtureDef is deprecated:pytest.PytestRemovedIn10Warning